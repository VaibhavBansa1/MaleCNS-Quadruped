<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Helvetica, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="600" fill="#fff"/>
  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold">Wiring</text>
  <!-- PC -->
  <rect x="30" y="60" width="170" height="90" rx="6" fill="#f2f2f2" stroke="#111" stroke-width="2"/>
  <text x="115" y="88" text-anchor="middle" font-weight="bold">PC (the brain)</text>
  <text x="115" y="108" text-anchor="middle" font-size="12">run_live.py + flybrain</text>
  <text x="115" y="126" text-anchor="middle" font-size="12">webcam + mic plugged in here</text>
  <!-- ESP32 -->
  <rect x="300" y="60" width="200" height="300" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="400" y="85" text-anchor="middle" font-weight="bold">ESP32 dev board</text>
  <g font-size="12">
    <text x="310" y="115">USB</text>
    <text x="490" y="140" text-anchor="end">3V3</text>
    <text x="490" y="165" text-anchor="end">GND</text>
    <text x="490" y="190" text-anchor="end">GPIO21 SDA</text>
    <text x="490" y="215" text-anchor="end">GPIO22 SCL</text>
    <text x="490" y="255" text-anchor="end">GPIO23 (OLED power)</text>
    <text x="490" y="280" text-anchor="end">GPIO18 SDA2</text>
    <text x="490" y="305" text-anchor="end">GPIO19 SCL2</text>
    <text x="310" y="300">GPIO34 mic L</text>
    <text x="310" y="325">GPIO35 mic R</text>
  </g>
  <line x1="200" y1="110" x2="300" y2="110" stroke="#111" stroke-width="3"/>
  <text x="250" y="102" text-anchor="middle" font-size="11">USB cable</text>
  <text x="250" y="128" text-anchor="middle" font-size="11">F B L R S, E ...</text>
  <!-- PCA9685 -->
  <rect x="610" y="110" width="240" height="210" rx="6" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="730" y="135" text-anchor="middle" font-weight="bold">PCA9685 servo driver</text>
  <g font-size="12">
    <text x="620" y="160">VCC</text><text x="620" y="185">GND</text><text x="620" y="210">SDA</text><text x="620" y="235">SCL</text>
    <text x="840" y="160" text-anchor="end">ch 0 → leg front-left</text>
    <text x="840" y="180" text-anchor="end">ch 1 → leg front-right</text>
    <text x="840" y="200" text-anchor="end">ch 2 → leg back-left</text>
    <text x="840" y="220" text-anchor="end">ch 3 → leg back-right</text>
    <text x="840" y="240" text-anchor="end">ch 4 → head (180° servo)</text>
    <text x="620" y="290">V+  and  GND  (green screw terminal)</text>
  </g>
  <g stroke="#111" stroke-width="2" fill="none">
    <polyline points="500,136 560,136 560,156 610,156"/>
    <polyline points="500,161 570,161 570,181 610,181" stroke-dasharray="6 4"/>
    <polyline points="500,186 580,186 580,206 610,206"/>
    <polyline points="500,211 590,211 590,231 610,231"/>
  </g>
  <!-- supply -->
  <rect x="610" y="400" width="240" height="70" rx="6" fill="#f2f2f2" stroke="#111" stroke-width="2"/>
  <text x="730" y="428" text-anchor="middle" font-weight="bold">5-6 V, 2 A+ supply</text>
  <text x="730" y="448" text-anchor="middle" font-size="12">phone charger: servo power only</text>
  <line x1="700" y1="400" x2="700" y2="300" stroke="#111" stroke-width="3"/>
  <line x1="760" y1="400" x2="760" y2="300" stroke="#111" stroke-width="3" stroke-dasharray="6 4"/>
  <text x="708" y="380" font-size="11">+</text><text x="768" y="380" font-size="11">−</text>
  <!-- OLED -->
  <rect x="290" y="420" width="220" height="85" rx="6" fill="#111"/>
  <text x="400" y="452" text-anchor="middle" fill="#fff" font-weight="bold">0.96" SSD1306 OLED</text>
  <text x="400" y="472" text-anchor="middle" fill="#fff" font-size="11">VCC ← GPIO23 · SDA ← 18 · SCL ← 19</text>
  <text x="400" y="490" text-anchor="middle" fill="#fff" font-size="11">GND → ESP32 GND · address 0x3C</text>
  <g stroke="#111" stroke-width="2" fill="none">
    <polyline points="500,251 540,251 540,440 510,440"/>
    <polyline points="500,276 550,276 550,460 510,460"/>
    <polyline points="500,301 560,301 560,480 510,480"/>
  </g>
  <!-- mics -->
  <rect x="40" y="280" width="170" height="70" rx="6" fill="#fff" stroke="#111" stroke-dasharray="5 4" stroke-width="2"/>
  <text x="125" y="305" text-anchor="middle" font-weight="bold">optional robot ears</text>
  <text x="125" y="324" text-anchor="middle" font-size="12">MAX4466 (L), KY-037 (R)</text>
  <text x="125" y="340" text-anchor="middle" font-size="12">powered from 3V3</text>
  <line x1="210" y1="305" x2="300" y2="296" stroke="#111" stroke-dasharray="5 4"/>
  <line x1="210" y1="330" x2="300" y2="321" stroke="#111" stroke-dasharray="5 4"/>
  <!-- notes -->
  <g font-size="12" fill="#222">
    <text x="30" y="535">Solid line = signal / positive · dashed line = ground. All grounds are shared (ESP32, PCA9685, supply).</text>
    <text x="30" y="555">Never power the servos from the ESP32. Never power the OLED from 5 V / VIN: its pull-ups would put 5 V on the ESP32's 3.3 V pins.</text>
    <text x="30" y="575">The webcam and microphone plug into the PC, not the robot.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
