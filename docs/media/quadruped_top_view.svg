<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="760" height="560" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
  </defs>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Quadruped, seen from above</text>
  <!-- front arrow -->
  <line x1="380" y1="78" x2="380" y2="48" stroke="#111" stroke-width="2" marker-end="url(#ar)"/>
  <text x="392" y="66" fill="#111">FRONT (walks this way on F)</text>
  <!-- body -->
  <rect x="250" y="90" width="260" height="380" rx="10" fill="#f2f2f2" stroke="#111" stroke-width="2.5"/>
  <text x="380" y="300" text-anchor="middle" fill="#444">cardboard body</text>
  <text x="380" y="320" text-anchor="middle" fill="#444">ESP32 + PCA9685 inside</text>
  <!-- head -->
  <circle cx="380" cy="140" r="32" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="380" y="137" text-anchor="middle" font-size="11">head</text>
  <text x="380" y="151" text-anchor="middle" font-size="11">servo ch 4</text>
  <rect x="345" y="180" width="70" height="36" fill="#111"/>
  <text x="380" y="203" text-anchor="middle" fill="#fff" font-size="12">OLED face</text>
  <path d="M325,150 A55,55 0 0 1 435,150" fill="none" stroke="#111" stroke-dasharray="4 3"/>
  <text x="440" y="128" font-size="11" fill="#444">turns ±60°</text>
  <text x="440" y="142" font-size="11" fill="#444">toward steer</text>
  <!-- legs: diagonal pair A solid, pair B hatched -->
  <g stroke="#111" stroke-width="2">
    <rect x="200" y="130" width="50" height="40" fill="#111"/>
    <rect x="510" y="130" width="50" height="40" fill="#fff"/>
    <rect x="200" y="390" width="50" height="40" fill="#fff"/>
    <rect x="510" y="390" width="50" height="40" fill="#111"/>
  </g>
  <g font-size="13">
    <text x="190" y="140" text-anchor="end" font-weight="bold">Leg 0  front-left</text>
    <text x="190" y="158" text-anchor="end">PCA9685 ch 0 · IS_LEFT</text>
    <text x="190" y="176" text-anchor="end">pair A</text>
    <text x="570" y="140" font-weight="bold">Leg 1  front-right</text>
    <text x="570" y="158">PCA9685 ch 1</text>
    <text x="570" y="176">pair B</text>
    <text x="190" y="400" text-anchor="end" font-weight="bold">Leg 2  back-left</text>
    <text x="190" y="418" text-anchor="end">PCA9685 ch 2 · IS_LEFT</text>
    <text x="190" y="436" text-anchor="end">pair B</text>
    <text x="570" y="400" font-weight="bold">Leg 3  back-right</text>
    <text x="570" y="418">PCA9685 ch 3</text>
    <text x="570" y="436">pair A</text>
  </g>
  <!-- legend -->
  <rect x="40" y="490" width="16" height="16" fill="#111"/><text x="64" y="503">pair A (legs 0 + 3) swing together</text>
  <rect x="330" y="490" width="16" height="16" fill="#fff" stroke="#111" stroke-width="2"/><text x="354" y="503">pair B (legs 1 + 2), half a step later</text>
  <text x="40" y="535" fill="#444">Each leg is one servo that swings forward / back (1 degree of freedom). The webcam stays on the desk.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
