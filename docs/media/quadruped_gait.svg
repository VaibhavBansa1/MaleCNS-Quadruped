<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="860" height="540" fill="#fff"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="bold">One step cycle (periodMs = 1200 ms)</text>
  <g transform="translate(110,60)">
    <!-- axes pair A -->
    <text x="-12" y="15" text-anchor="end" font-weight="bold">pair A</text>
    <text x="-12" y="33" text-anchor="end" font-size="12">legs 0 + 3</text>
    <line x1="0" y1="60" x2="560" y2="60" stroke="#bbb"/>
    
    <polyline fill="none" stroke="#111" stroke-width="3" points="0,10 364,110 560,10"/>
    <!-- pair B shifted by half -->
    <text x="-12" y="165" text-anchor="end" font-weight="bold">pair B</text>
    <text x="-12" y="183" text-anchor="end" font-size="12">legs 1 + 2</text>
    <line x1="0" y1="210" x2="560" y2="210" stroke="#bbb"/><text x="565" y="214" font-size="12" fill="#444">90°</text><text x="565" y="164" font-size="12" fill="#444">+25°</text><text x="565" y="264" font-size="12" fill="#444">−25°</text>
    <polyline fill="none" stroke="#111" stroke-width="3" stroke-dasharray="8 5" points="0,237 84,260 280,160 560,237"/>
    <!-- labels -->
    <g font-size="12" fill="#444">
      <text x="565" y="14">+25° forward</text><text x="565" y="64">90° (leg straight down)</text><text x="565" y="114">−25° back</text>
    </g>
    <!-- phase bands for pair A -->
    <rect x="0" y="290" width="364" height="26" fill="#111"/><text x="182" y="308" text-anchor="middle" fill="#fff">A pushes (stance, 65% = 780 ms, slow)</text>
    <rect x="364" y="290" width="196" height="26" fill="#fff" stroke="#111"/><text x="462" y="308" text-anchor="middle">A returns (35%, fast)</text>
    <line x1="0" y1="330" x2="560" y2="330" stroke="#111"/>
    <g font-size="12"><text x="0" y="348">0</text><text x="280" y="348" text-anchor="middle">600 ms</text><text x="560" y="348" text-anchor="end">1200 ms</text></g>
  </g>
  <g transform="translate(40,450)" font-size="13">
    <text font-weight="bold">How the five commands use this cycle</text>
    <text y="22">F  all legs run the cycle forward.   B  all legs run it reversed.   S  all legs return to 90° and hold.</text>
    <text y="44">L  left legs (0, 2) run it reversed, right legs (1, 3) forward: the robot spins left on the spot</text>
    <text y="66">R  the opposite. Servo speed is limited to 300°/s; a 500 ms watchdog stops the legs if the PC goes quiet.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
